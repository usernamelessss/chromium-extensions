<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>生成图标</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="manage">
  <main>
    <h1>生成图标</h1>
    <p class="muted">工具栏图标已经自动生效。扩展管理页里显示的图标需要 PNG 文件：点下面的按钮下载 4 个文件，放进扩展目录的 <code>icons</code> 文件夹，再按说明修改 manifest.json。</p>
